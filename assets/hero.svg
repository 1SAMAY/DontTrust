<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020202"/>
      <stop offset="1" stop-color="#090d12"/>
    </linearGradient>
    <linearGradient id="line" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00ff66" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#ff5c73" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb84d" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
