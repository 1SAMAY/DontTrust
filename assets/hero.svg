  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="364" rx="22" fill="#050505" stroke="#151515" stroke-width="2"/>

  <circle cx="930" cy="90" r="92" fill="#ff5c73" opacity="0.18" filter="url(#blur)"/>
  <circle cx="260" cy="310" r="120" fill="#00ff66" opacity="0.08" filter="url(#blur)"/>
  <rect x="80" y="92" width="1040" height="4" rx="2" fill="url(#line)"/>

  <g font-family="Consolas, monospace">
    <text x="84" y="166" fill="#79b879" font-size="28" font-weight="700">C:\Windows\System32&gt; security breach simulation</text>
    <text x="84" y="208" fill="#d8ffd8" font-size="20">Fake alerts, popup warnings, and console-style drama.</text>
    <text x="84" y="250" fill="#79b879" font-size="20">No real hacking. No network activity. Just a cinematic desktop UI.</text>
  </g>

  <g transform="translate(760 156)">
    <rect width="360" height="152" rx="18" fill="#080808" stroke="#1c1c1c" stroke-width="2"/>
    <rect x="0" y="0" width="360" height="30" rx="18" fill="#ff5c73"/>
    <circle cx="26" cy="15" r="6" fill="#120305"/>
    <circle cx="46" cy="15" r="6" fill="#120305" opacity="0.8"/>
    <circle cx="66" cy="15" r="6" fill="#120305" opacity="0.6"/>
    <g font-family="Consolas, monospace" font-size="15">
