      <text x="18" y="94" fill="#f4f7f4">Unauthorized access detected.</text>
      <text x="18" y="120" fill="#79b879">Firewall integrity: 78%</text>
    </g>
  </g>

  <g font-family="Consolas, monospace" font-size="16">
    <text x="84" y="320" fill="#ffb84d">[WARNING] Your security is breached.</text>
    <text x="84" y="352" fill="#ff5c73">[ERROR] Password vault exposure detected.</text>
